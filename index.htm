<!doctype html><html lang="hu"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Szerkeszthető értékesítési térkép</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<link rel="stylesheet" href="https://unpkg.com/@geoman-io/leaflet-geoman-free@2.18.0/dist/leaflet-geoman.css">
<style>
html,body,#map{height:100%;margin:0}.top{position:absolute;z-index:1000;top:10px;left:50px;background:#fff;padding:9px 11px;border-radius:7px;box-shadow:0 1px 7px #777;font:13px Arial;max-width:620px}
button{margin:4px 3px 0 0;padding:6px 9px}.ok{font-weight:bold;color:#075eb5}
</style></head><body>
<div class="top"><span class="ok">Szerkeszthető értékesítési térkép</span><br>
A bal oldali eszköztárral rajzolhatsz és szerkeszthetsz. A pontokat megfogva húzd a vonalat. Új határhoz válaszd a vonalrajzolást.
<br><button onclick="saveLocal()">Mentés ezen a gépen</button>
<button onclick="loadLocal()">Mentett állapot betöltése</button>
<button onclick="downloadGeoJSON()">GeoJSON letöltése</button>
<button onclick="resetMap()">Kiinduló állapot</button></div>
<div id="map"></div>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="https://unpkg.com/@geoman-io/leaflet-geoman-free@2.18.0/dist/leaflet-geoman.min.js"></script>
<script>
const map=L.map('map').setView([47.35,19.75],7);
L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:19,attribution:'&copy; OpenStreetMap közreműködők'}).addTo(map);
const group=L.featureGroup().addTo(map);
function addLine(coords,color='#0066cc'){let l=L.polyline(coords,{color,weight:5,opacity:.93,pmIgnore:false}); l.addTo(group); return l;}
const initial=[
[[48.07,18.82],[48.02,18.80],[47.96,18.80],[47.90,18.82],[47.827,18.87],[47.80,18.89],[47.76,18.91],[47.71,18.92],[47.66,18.96],[47.62,19.00],[47.59,19.02],[47.57,18.99],[47.56,18.94],[47.55,18.88],[47.52,18.82],[47.49,18.78],[47.45,18.76],[47.40,18.75],[47.35,18.76],[47.31,18.76],[47.27,18.79],[47.23,18.84],[47.20,18.91]],
[[47.20,18.91],[47.15,18.91],[47.10,18.92],[47.05,18.94],[47.00,18.96],[46.95,18.98],[46.90,18.99],[46.91,19.10],[46.93,19.22],[46.96,19.34],[46.99,19.45],[47.02,19.55],[47.05,19.62],[47.12,19.64],[47.19,19.66],[47.245,19.68],[47.27,19.92],[47.29,20.07],[47.37,20.63],[47.51,20.82],[47.57,21.10],[47.66,21.35],[47.78,21.55],[47.80,21.75],[47.78,21.98],[47.72,22.18],[47.64,22.38],[47.58,22.62],[47.56,22.88]]
];
function resetMap(){group.clearLayers();initial.forEach(x=>addLine(x));}
resetMap();
map.pm.addControls({position:'topleft',drawMarker:false,drawCircleMarker:false,drawCircle:false,drawRectangle:false,drawPolygon:true,drawPolyline:true,drawText:false,editMode:true,dragMode:true,cutPolygon:false,removalMode:true,rotateMode:false});
map.pm.setGlobalOptions({snappable:true,snapDistance:15});
map.on('pm:create',e=>{ if(e.layer){e.layer.setStyle && e.layer.setStyle({color:'#d43f3a',weight:5}); group.addLayer(e.layer);} });
function exportData(){return group.toGeoJSON();}
function saveLocal(){localStorage.setItem('salesTerritoryMap',JSON.stringify(exportData()));alert('Elmentve ezen a gépen/böngészőben.');}
function loadLocal(){let s=localStorage.getItem('salesTerritoryMap');if(!s){alert('Nincs mentett állapot.');return;}group.clearLayers();L.geoJSON(JSON.parse(s),{style:f=>({color:(f.properties&&f.properties.color)||'#0066cc',weight:5}),onEachFeature:(f,l)=>group.addLayer(l)});}
function downloadGeoJSON(){let blob=new Blob([JSON.stringify(exportData(),null,2)],{type:'application/geo+json'});let a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='ertekesitesi-teruletek.geojson';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000);}
</script></body></html>
