<!doctype html><html lang="hu"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>1-es terület településlista</title>
<style>body{font-family:Arial,sans-serif;margin:24px;color:#222}h1{font-size:22px;color:#075eb5}.bar{display:flex;gap:8px;flex-wrap:wrap;margin:14px 0}button{padding:9px 13px;font-size:14px}.status{padding:10px;background:#f3f6f8;border-radius:6px;margin:10px 0;max-width:900px}table{border-collapse:collapse;width:100%;max-width:900px;margin-top:12px}th,td{border:1px solid #ddd;padding:6px 8px;text-align:left}th{background:#f2f2f2}.note{font-size:12px;color:#555;max-width:900px}</style></head><body>
<h1>1-es értékesítési terület – településlista</h1><div class="status" id="status">Adatok betöltése…</div><div class="bar"><button id="reload">Lista újraszámítása</button><button id="csv" disabled>CSV letöltése (Excelhez)</button><button onclick="location.href='./'">Vissza a térképhez</button></div>
<div class="note">Az aktuális GitHubos kék határvonalból számol. A határhoz nagyon közeli településeket érdemes külön ellenőrizni.</div><table><thead><tr><th>#</th><th>Település</th></tr></thead><tbody id="rows"></tbody></table>
<script src="https://cdn.jsdelivr.net/npm/@turf/turf@7/turf.min.js"></script><script>
const BOUNDARY='./ertekesitesi-teruletek-v01.geojson', SETTLEMENTS='https://raw.githubusercontent.com/wuerdo/geoHungary/master/settlements.geojson', COUNTRY='https://raw.githubusercontent.com/glynnbird/countriesgeojson/master/hungary.geojson';let result=[];
function nearestIndex(ring,p){let bi=0,bd=Infinity;for(let i=0;i<ring.length;i++){let d=(ring[i][0]-p[0])**2+(ring[i][1]-p[1])**2;if(d<bd){bd=d;bi=i}}return bi}
function arc(r,a,b,f){let o=[r[a]],i=a,n=r.length-1,g=0;while(i!==b&&g++<n+2){i=f?(i+1)%n:(i-1+n)%n;o.push(r[i])}return o}
function joinBoundary(g){let ls=g.features.filter(f=>f.geometry?.type==='LineString').map(f=>f.geometry.coordinates),l=ls[0].slice();for(let k=1;k<ls.length;k++){let s=ls[k].slice(),z=l[l.length-1],d0=(s[0][0]-z[0])**2+(s[0][1]-z[1])**2,d1=(s.at(-1)[0]-z[0])**2+(s.at(-1)[1]-z[1])**2;if(d1<d0)s.reverse();l=l.concat(s.slice(1))}return l}
function poly(line,ring,f){let a=nearestIndex(ring,line[0]),b=nearestIndex(ring,line.at(-1)),c=line.concat(arc(ring,b,a,f));c.push(c[0]);return turf.polygon([c])}
async function build(){let st=document.getElementById('status'),tb=document.getElementById('rows');st.textContent='Határvonal és települések betöltése…';tb.innerHTML='';csv.disabled=true;try{let [br,sr,cr]=await Promise.all([fetch(BOUNDARY,{cache:'no-store'}),fetch(SETTLEMENTS),fetch(COUNTRY)]),bg=await br.json(),sg=await sr.json(),cg=await cr.json(),line=joinBoundary(bg),geom=cg.type==='Feature'?cg.geometry:cg.features[0].geometry,ring=geom.type==='Polygon'?geom.coordinates[0]:geom.coordinates[0][0],p1=poly(line,ring,true),p2=poly(line,ring,false),bud=turf.point([19.0402,47.4979]),ny=turf.point([21.7187,47.9554]),score=p=>(turf.booleanPointInPolygon(bud,p)?1:0)+(turf.booleanPointInPolygon(ny,p)?1:0),area=score(p1)>=score(p2)?p1:p2;result=[];for(let f of sg.features){try{if(turf.booleanPointInPolygon(turf.pointOnFeature(f),area))result.push({name:f.properties.NAME||f.properties.name||''})}catch(e){}}result=result.filter(x=>x.name).sort((a,b)=>a.name.localeCompare(b.name,'hu'));result.forEach((x,i)=>{let tr=document.createElement('tr');tr.innerHTML='<td>'+(i+1)+'</td><td>'+x.name+'</td>';tb.appendChild(tr)});st.textContent='Kész: '+result.length+' település az 1-es területen.';csv.disabled=false}catch(e){st.textContent='Hiba: '+e.message}}
function dl(){let s='Sorszám;Település\r\n'+result.map((x,i)=>(i+1)+';"'+x.name.replace(/"/g,'""')+'"').join('\r\n'),b=new Blob(['\ufeff'+s],{type:'text/csv;charset=utf-8'}),a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='1-es_ertekesitesi_terulet_telepulesek.csv';a.click()}
reload.onclick=build;csv.onclick=dl;build();</script></body></html>
